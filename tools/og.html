<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: radial-gradient(120% 90% at 30% 0%, #fffaf2 0%, #fff6ea 55%, #ffeedd 100%); font-family: Nunito, sans-serif; color: #3b3330; position: relative; }
  .blob { position: absolute; border-radius: 50%; filter: blur(60px); opacity: .6; }
  .card { position: absolute; left: 120px; top: 52px; width: 320px; height: 526px; background: #fffdf7; border-radius: 18px; box-shadow: 0 24px 60px rgba(90,50,30,.18); transform: rotate(-3deg); }
  .card svg { width: 100%; height: 100%; display: block; border-radius: 18px; }
  .tape { position: absolute; z-index: 1; top: -2px; left: -36px; width: 108px; height: 32px; transform: rotate(-40deg); filter: drop-shadow(0 1px 1px rgba(90,60,30,.18)); }
  .tape::before { content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,.7), rgba(255,255,255,.25) 30%, rgba(255,255,255,.18) 70%, rgba(255,255,255,.45)),
      repeating-linear-gradient(90deg, rgba(150,120,90,.035) 0 2px, transparent 2px 5px), rgba(244,236,220,.5);
    clip-path: polygon(0 6%, 3% 0, 97% 0, 100% 9%, 98% 21%, 100% 33%, 97.5% 46%, 100% 58%, 98% 70%, 100% 82%, 97% 100%, 3% 100%, 0 90%, 2% 77%, 0 64%, 2.5% 51%, 0 39%, 2% 26%, 0 14%); }
  .txt { position: absolute; left: 520px; top: 150px; width: 600px; }
  h1 { font-family: Fredoka, sans-serif; font-weight: 600; font-size: 74px; line-height: 1.02; margin: 0 0 22px; letter-spacing: -1px; }
  h1 span { color: #ff7f6e; }
  p { font-size: 30px; margin: 0; color: #7d706a; }
  .pill { display: inline-block; margin-top: 30px; padding: 12px 24px; border-radius: 999px; background: #ffd65c; font-family: Fredoka, sans-serif; font-weight: 600; font-size: 26px; }
</style></head>
<body>
<i class="blob" style="width:420px;height:420px;background:#ffd3c4;left:-120px;top:-140px"></i>
<i class="blob" style="width:380px;height:380px;background:#d9ccfa;right:-100px;top:120px"></i>
<i class="blob" style="width:360px;height:360px;background:#c4ecdc;left:380px;bottom:-200px"></i>
<div class="card"><svg id="s" viewBox="0 0 760 1248"></svg><div class="tape"></div></div>
<div class="txt">
  <h1>Jiayin's First Month <span>At Work</span></h1>
  <p>A colour-by-number, one spot every evening.</p>
  <div class="pill">✨ New spot at 6pm</div>
</div>
<script src="../js/config.js"></script>
<script src="../js/art.js"></script>
<script>
  const NS = 'http://www.w3.org/2000/svg', s = document.getElementById('s');
  const mk = (t, a, p) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); p.appendChild(e); return e; };
  const sun = ART.regions.find(r => r.id === 'sun');
  mk('path', { d: sun.d, fill: '#F4C21B', 'fill-rule': 'evenodd' }, s);
  const g = mk('g', { fill: 'none', stroke: '#3b3330', 'stroke-width': 3.4, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, s);
  ART.lines.forEach(d => mk('path', { d }, g));
  ART.circles.forEach(c => mk('circle', { cx: c.cx, cy: c.cy, r: c.r }, g));
  ART.labels.forEach(l => { const n = CONFIG.regions[l.region]; if (n == null) return; const t = mk('text', { x: l.x, y: l.y, dy: '.36em', 'font-size': l.size * 1.32, 'text-anchor': 'middle', fill: '#3b3330', 'font-family': 'Patrick Hand' }, s); t.textContent = n; });
</script>
</body></html>
